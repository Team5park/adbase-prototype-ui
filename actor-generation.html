<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generate Actor — AdBase</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', 'sans-serif'],
            heading: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            primary: '#4f46e5',
            success: '#22c55e'
          }
        }
      }
    }
  </script>

  <style>
    :root { color-scheme: dark; }
    body { background-color: #07090e; }
    .app-header {
      background: rgba(7, 9, 14, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-color: rgba(255,255,255,0.07);
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .field-input {
      background: rgba(7, 9, 14, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: #f1f5f9;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field-input:focus {
      outline: none;
      border-color: rgba(99, 102, 241, 0.6);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }
    .field-input::placeholder { color: #475569; }
    .field-input option { background: #0b0f19; }
    .btn-submit {
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn-submit:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .btn-submit:active:not(:disabled) { transform: translateY(0); }
    .btn-submit:disabled { background: #334155; cursor: not-allowed; transform: none; opacity: 1; }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.35; } 50% { opacity: 0.6; }
    }
    .animate-glow { animation: pulse-glow 5s ease-in-out infinite; }
  </style>
</head>

<body class="font-sans antialiased text-slate-100 min-h-screen">

  <!-- Ambient Glows -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute top-[-5%] right-[15%] w-[450px] h-[450px] bg-indigo-600/12 rounded-full blur-[120px] animate-glow"></div>
    <div class="absolute bottom-[5%] left-[5%] w-[350px] h-[350px] bg-cyan-500/10 rounded-full blur-[110px]"></div>
  </div>

  <!-- STICKY GLASS HEADER -->
  <header class="sticky top-0 z-50 border-b app-header">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 group">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 p-[1px] shadow-lg shadow-indigo-500/20">
          <div class="w-full h-full rounded-[10px] flex items-center justify-center" style="background:#07090e">
            <svg class="w-4 h-4 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
          </div>
        </div>
        <span class="font-heading font-extrabold text-xl tracking-tight text-white">AdBase</span>
      </a>

      <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-400">
        <a href="dashboard.html" class="hover:text-white transition">Dashboard</a>
        <a href="actors.html" class="hover:text-white transition text-indigo-400">Actors</a>
        <a href="library.html" class="hover:text-white transition">Library</a>
      </nav>

      <!-- Right actions including Profile Dropdown -->
      <div class="flex items-center gap-4">
        <a href="actors.html" class="inline-flex items-center gap-1.5 text-sm text-slate-400 hover:text-white transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
          Actor Library
        </a>

        <!-- Profile Dropdown Component -->
        <div class="relative flex-shrink-0" id="profileContainer">
          <button id="profileDropdownBtn" type="button" class="w-9 h-9 rounded-full bg-gradient-to-tr from-indigo-600 to-cyan-500 p-[1px] focus:outline-none flex items-center justify-center hover:scale-105 active:scale-95 transition">
            <div class="w-full h-full rounded-full bg-dark-950 flex items-center justify-center font-heading font-bold text-white text-sm uppercase" id="profileInitials">
              U
            </div>
          </button>
          <div id="profileDropdownMenu" class="dropdown-menu hidden absolute right-0 mt-2 w-48 rounded-2xl shadow-2xl z-50 p-1.5" style="background: rgba(11, 15, 25, 0.98); border: 1px solid rgba(255,255,255,0.09); backdrop-filter: blur(16px);">
            <div class="px-3.5 py-2.5 border-b border-white/[0.05]">
              <p class="text-[10px] font-mono text-slate-400">Signed in as</p>
              <p class="text-sm font-semibold text-white truncate" id="profileUsername">Username</p>
            </div>
            <div class="p-1">
              <button onclick="handleSignOut()" class="w-full text-left px-3 py-2 rounded-xl text-xs text-rose-400 hover:bg-rose-500/10 flex items-center gap-2 font-medium transition">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Sign out
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="relative z-10 max-w-3xl mx-auto px-6 py-10">

    <!-- Page Header -->
    <div class="mb-8">
      
      <h2 class="font-heading text-3xl font-extrabold text-white mb-1">Generate AI Actor</h2>
      <p class="text-slate-400 text-sm">Design a custom AI creator persona with targeted demographics and style traits.</p>
    </div>

    <!-- FORM CARD -->
    <section class="glass-card rounded-3xl p-7 sm:p-9 shadow-2xl shadow-indigo-950/40" style="border-color:rgba(99,102,241,0.15)">

      <!-- Section Label -->
      <div class="flex items-center gap-2 mb-7 pb-5" style="border-bottom:1px solid rgba(255,255,255,0.07)">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.2)">
          <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        </div>
        <h4 class="font-heading text-lg font-bold text-white">Actor Image Generation</h4>
      </div>

      <!-- FORM (ALL IDs, names, required, events PRESERVED EXACTLY) -->
      <form id="actorForm" class="grid gap-6">

        <!-- Actor Name -->
        <div>
          <label for="actorName" class="block text-sm font-medium text-slate-300 mb-2">Actor Name</label>
          <input id="actorName" name="actorName" type="text" required placeholder="Enter actor name"
            class="field-input mt-0 w-full rounded-2xl px-4 py-3 text-sm" />
        </div>

        <!-- Gender + Age Band -->
        <div class="grid gap-5 md:grid-cols-2">
          <div>
            <label for="gender" class="block text-sm font-medium text-slate-300 mb-2">Gender</label>
            <select id="gender" name="gender" required class="field-input w-full rounded-2xl px-4 py-3 text-sm">
              <option value="female" selected>Female</option>
              <option value="male">Male</option>
            </select>
          </div>
          <div>
            <label for="ageBand" class="block text-sm font-medium text-slate-300 mb-2">Age Band</label>
            <select id="ageBand" name="ageBand" required class="field-input w-full rounded-2xl px-4 py-3 text-sm">
              <option value="18-24" selected>18–24</option>
              <option value="25-34">25–34</option>
              <option value="35-44">35–44</option>
              <option value="45-54">45–54</option>
              <option value="55+">55+</option>
            </select>
          </div>
        </div>

        <!-- Ethnicity -->
        <div>
          <label for="ethnicity" class="block text-sm font-medium text-slate-300 mb-2">Ethnicity</label>
          <input id="ethnicity" name="ethnicity" type="text" required placeholder="e.g. East Asian, Latina, South Asian"
            class="field-input w-full rounded-2xl px-4 py-3 text-sm" />
        </div>

        <!-- Traits: Hair, Style, Vibe -->
        <div>
          <p class="block text-sm font-medium text-slate-300 mb-3">Style Traits</p>
          <div class="grid gap-4 md:grid-cols-3">
            <div>
              <label for="hairTraits" class="block text-xs font-medium text-slate-400 mb-2">Hair Traits</label>
              <input id="hairTraits" name="hairTraits" type="text" required placeholder="e.g. curly, blond"
                class="field-input w-full rounded-2xl px-4 py-3 text-sm" />
            </div>
            <div>
              <label for="styleTraits" class="block text-xs font-medium text-slate-400 mb-2">Style Traits</label>
              <input id="styleTraits" name="styleTraits" type="text" required placeholder="e.g. casual, vintage"
                class="field-input w-full rounded-2xl px-4 py-3 text-sm" />
            </div>
            <div>
              <label for="vibeTraits" class="block text-xs font-medium text-slate-400 mb-2">Vibe Traits</label>
              <input id="vibeTraits" name="vibeTraits" type="text" required placeholder="e.g. energetic, calm"
                class="field-input w-full rounded-2xl px-4 py-3 text-sm" />
            </div>
          </div>
        </div>

        <!-- Submit & Status -->
        <div class="space-y-3 pt-2" style="border-top:1px solid rgba(255,255,255,0.07)">
          <button id="createActorBtn" type="submit" disabled
            class="btn-submit inline-flex w-full justify-center items-center gap-2 rounded-2xl px-6 py-3.5 text-sm font-semibold text-white">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Create Actor
          </button>
          <p id="status" class="text-center text-xs font-mono text-slate-400"></p>
        </div>

      </form>
    </section>

  </main>

  <!-- FUNCTIONAL SCRIPT (PRESERVED EXACTLY) -->
  <script>
    const form = document.getElementById('actorForm');
    const submitButton = document.getElementById('createActorBtn');
    const statusText = document.getElementById('status');

    const updateButtonState = () => {
      const fields = Array.from(form.querySelectorAll('input[required], select[required]'));
      const allFilled = fields.every((field) => field.value.trim() !== '');
      submitButton.disabled = !allFilled;
      statusText.textContent = allFilled ? 'Ready to create your actor.' : 'Fill in every field to enable the button.';
    };

    form.addEventListener('input', updateButtonState);
    form.addEventListener('change', updateButtonState);

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (submitButton.disabled) return;

      submitButton.disabled = true;
      submitButton.textContent = 'Creating actor...';
      statusText.textContent = 'Generating actor image and saving details...';

      const actorData = {
        name: document.getElementById('actorName').value.trim(),
        age_band: document.getElementById('ageBand').value,
        ethnicity: document.getElementById('ethnicity').value.trim(),
        gender_presentation: document.getElementById('gender').value,
        traits: {
          hair: document.getElementById('hairTraits').value.trim(),
          style: document.getElementById('styleTraits').value.trim(),
          vibe: document.getElementById('vibeTraits').value.trim()
        }
      };
      let status = await createActor(actorData);
      if (status) {
        statusText.textContent = 'Actor created successfully! Redirecting to actors library...';
        setTimeout(() => {
          window.location.href = 'actors.html';
        }, 1500);
      } else {
        statusText.textContent = 'Failed to create actor. Please try again.';
        submitButton.disabled = false;
        submitButton.textContent = 'Create Actor';
      }
    });

    async function createActor(payload) {
      const token = localStorage.getItem('adbase_token');

      try {
        const res = await fetch(`https://backend.tryadbase.com/api/actors/generate`, {
          method: 'POST',
          body: JSON.stringify(payload),
          headers: {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        return true;
      } catch (err) {
        console.error(err);
        return false;
      }
    }

    // Profile Dropdown logic
    const profileContainer = document.getElementById('profileContainer');
    const profileDropdownBtn = document.getElementById('profileDropdownBtn');
    const profileDropdownMenu = document.getElementById('profileDropdownMenu');
    const profileInitials = document.getElementById('profileInitials');
    const profileUsername = document.getElementById('profileUsername');

    if (profileDropdownBtn && profileDropdownMenu) {
      const username = localStorage.getItem('adbase_username') || 'User';
      if (profileUsername) profileUsername.textContent = username;
      if (profileInitials) profileInitials.textContent = username.charAt(0).toUpperCase();

      profileDropdownBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        profileDropdownMenu.classList.toggle('hidden');
      });

      document.addEventListener('click', (e) => {
        if (!profileContainer.contains(e.target)) {
          profileDropdownMenu.classList.add('hidden');
        }
      });
    }

    function handleSignOut() {
      localStorage.removeItem('adbase_token');
      localStorage.removeItem('adbase_username');
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
