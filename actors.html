<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Actors — AdBase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#4f46e5",
            success: "#22c55e"
          }
        }
      }
    }
  </script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- HEADER -->
  <header class="border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold">AdBase</h1>
      <a href="actor-generation.html"
        class="px-4 py-2 rounded-xl bg-primary hover:bg-indigo-500 transition font-medium">
        Create Actor
      </a>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-7xl mx-auto px-6 py-10">

    <!-- TOP BAR -->
    <!-- <section class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8"> -->

      <!-- Search -->
      <!-- <input type="text" placeholder="Search actors..."
        class="w-full md:w-1/3 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none" />


    </section> -->

    <!-- EMPTY STATE -->
    <section id="emptyState" class="border border-dashed border-slate-700 rounded-3xl p-14 text-center text-slate-400">
      <p class="text-lg mb-4">No actors created yet</p>
      <a href="actor-generation.html"
        class="inline-block px-6 py-3 rounded-xl bg-primary hover:bg-indigo-500 transition font-semibold">
        Create Your Actor
      </a>
    </section>

    <!-- ADS GRID -->
    <section id="adsGrid" class="hidden grid grid-cols-3 gap-6">
    </section>

  </main>

  <!-- FETCH ADS FROM API -->
  <script>
    const emptyState = document.getElementById("emptyState");
    const adsGrid = document.getElementById("adsGrid");

    async function fetchAds() {
      try {
        const token = localStorage.getItem('adbase_token');
        const response = await fetch("https://backend.tryadbase.com/api/actors", {
          method: "GET",
          headers: {
            "Authorization": `Bearer ${token}`,
          }
        });

        if (!response.ok) {
          throw new Error(`API error: ${response.status}`);
        }

        const data = await response.json();
        let ads = data.actors || [];
        ads = ads.filter(ad => ad.primary_variant && ad.primary_variant.image_url); // Filter out actors without image URLs

        if (ads.length > 0) {
          emptyState.classList.add("hidden");
          adsGrid.classList.remove("hidden");

          // Clear existing template card and populate with real data
          adsGrid.innerHTML = ads.map(ad => `
            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
              <div class="h-85  bg-slate-800 flex items-center justify-center text-slate-500">
                ${ad.primary_variant.image_url ? `<img src="${ad.primary_variant.image_url}" alt="${ad.id}" class="w-full h-full object-cover">` : "Actor Preview"}
              </div>

              <div class="p-4 space-y-2">
                <h3 class="font-semibold truncate">${ad.name}</h3>
                <div class="flex justify-between items-center pt-2">
                  <span class="text-xs ${ad.status === 'succeeded' ? 'text-success' : 'text-yellow-500'} font-medium capitalize">${ad.status}</span>
                </div>
              </div>
            </div>
          `).join("");
        }
      } catch (error) {
        console.error("Error fetching actors:", error);
        emptyState.innerHTML = `<p class="text-lg mb-4">Error loading actors: ${error.message}</p>`;
      }
    }

    // Fetch actors on page load
    fetchAds();
  </script>

</body>

</html>
