<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Generate Ad — AdBase</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#4f46e5",
                        success: "#22c55e"
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- HEADER -->
    <header class="border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <h1 class="text-xl font-bold">AdBase</h1>
        </div>
    </header>

    <!-- MAIN -->
    <main class="max-w-7xl mx-auto px-6 py-10 grid grid-cols-1 lg:grid-cols-3 gap-10">

        <!-- LEFT: AD SETUP -->
        <section class="lg:col-span-2 space-y-8">

            <!-- STEP 1: PRODUCT SELECTOR -->
            <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                <h2 class="text-lg font-semibold mb-4">1. Select Product</h2>

                <!-- SEARCH INPUT -->
                <input id="productSearch" type="text" placeholder="Search products..."
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 mb-3 focus:ring-2 focus:ring-primary outline-none"
                    onkeyup="filterProducts()" />

                <!-- PRODUCT LIST -->
                <ul id="productList" class="max-h-60 overflow-y-auto space-y-2">
                    <!-- Items populated via JS -->
                </ul>
            </section>

            <!-- AUTO BRIEF -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                <h2 class="text-lg font-semibold mb-4">Ad Brief (Auto-filled)</h2>

                <textarea rows="4"
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary">High-quality product for daily use. Highlight benefits, lifestyle use, and CTA.</textarea>
            </div>

            <!-- TEMPLATE SELECT -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                <h2 class="text-lg font-semibold mb-4">Select Template</h2>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <button class="border border-primary bg-primary/10 rounded-xl p-4 text-left">
                        <h3 class="font-semibold">Influencer Hook</h3>
                        <p class="text-sm text-slate-400">Creator-style short ad</p>
                    </button>

                    <button class="border border-slate-700 rounded-xl p-4 text-left hover:border-primary">
                        <h3 class="font-semibold">Problem → Solution</h3>
                        <p class="text-sm text-slate-400">Pain point driven</p>
                    </button>

                    <button class="border border-slate-700 rounded-xl p-4 text-left hover:border-primary">
                        <h3 class="font-semibold">Feature Highlight</h3>
                        <p class="text-sm text-slate-400">Product-led</p>
                    </button>
                </div>
            </div>

            <!-- GENERATE BUTTON -->
            <button onclick="startGeneration()"
                class="w-full py-4 rounded-2xl bg-primary hover:bg-indigo-500 transition font-semibold text-lg">
                Start Ad Generation
            </button>

        </section>

        <!-- RIGHT: PROGRESS TIMELINE -->
        <aside class="bg-slate-900 border border-slate-800 rounded-2xl p-6">

            <h2 class="text-lg font-semibold mb-6">Generation Progress</h2>

            <ol id="timeline" class="relative border-l border-slate-700 space-y-6">

                <li class="ml-6 text-slate-500" data-step>
                    <span class="absolute -left-3 w-6 h-6 rounded-full bg-slate-700"></span>
                    <h3 class="font-semibold">Fetching Product Data</h3>
                </li>

                <li class="ml-6 text-slate-500" data-step>
                    <span class="absolute -left-3 w-6 h-6 rounded-full bg-slate-700"></span>
                    <h3 class="font-semibold">Generating Ad Script</h3>
                </li>

                <li class="ml-6 text-slate-500" data-step>
                    <span class="absolute -left-3 w-6 h-6 rounded-full bg-slate-700"></span>
                    <h3 class="font-semibold">Creating Visual Assets</h3>
                </li>

                <li class="ml-6 text-slate-500" data-step>
                    <span class="absolute -left-3 w-6 h-6 rounded-full bg-slate-700"></span>
                    <h3 class="font-semibold">Finalizing Ad</h3>
                </li>

            </ol>

        </aside>

    </main>

    <!-- SCRIPT -->
    <script>
        function startGeneration() {
            const steps = document.querySelectorAll("[data-step]");

            steps.forEach((step, index) => {
                setTimeout(() => {
                    step.classList.remove("text-slate-500");
                    step.classList.add("text-success");

                    const dot = step.querySelector("span");
                    dot.classList.remove("bg-slate-700");
                    dot.classList.add("bg-success");
                }, index * 1500);
            });
        }

        // Mock products
        const products = [
            {
                name: "Hydrating Face Serum",
                desc: "Lightweight serum for glowing skin",
                price: "₹799",
                img: "https://picsum.photos/60/60?random=1"
            },
            {
                name: "Wireless Earbuds",
                desc: "Noise cancelling earbuds with long battery life",
                price: "₹2,999",
                img: "https://picsum.photos/60/60?random=2"
            },
            {
                name: "Fitness Smartwatch",
                desc: "Track workouts, heart rate and sleep",
                price: "₹4,499",
                img: "https://picsum.photos/60/60?random=3"
            }
        ];

        const productList = document.getElementById("productList");
        const productSearch = document.getElementById("productSearch");

        function renderProducts(list) {
            productList.innerHTML = "";
            list.forEach((p, index) => {
                const li = document.createElement("li");
                li.className = "flex items-center gap-4 p-2 rounded-xl cursor-pointer hover:bg-slate-800";
                li.innerHTML = `
        <img src="${p.img}" alt="${p.name}" class="w-12 h-12 rounded-lg object-cover border border-slate-700" />
        <div>
          <p class="font-semibold">${p.name}</p>
          <p class="text-sm text-slate-400">${p.price}</p>
        </div>
      `;
                li.onclick = () => selectProduct(index);
                productList.appendChild(li);
            });
        }

        function filterProducts() {
            const query = productSearch.value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        function selectProduct(index) {
            const p = products[index];

            // Show Ad Brief Section
            document.getElementById("briefSection").classList.remove("hidden");
            document.getElementById("templateSection").classList.remove("hidden");

            // Fill inputs
            document.getElementById("briefName").value = p.name;
            document.getElementById("briefDesc").value = p.desc;
            document.getElementById("briefPrice").value = p.price;

            // Highlight selected product
            Array.from(productList.children).forEach((li, i) => {
                li.classList.toggle("bg-primary/20", i === index);
            });
        }

        // Initial render
        renderProducts(products);
    </script>

</body>

</html>
