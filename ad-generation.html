<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Generate Ad — AdBase</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#4f46e5",
                        success: "#22c55e"
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- HEADER -->
    <header class="border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <h1 class="text-xl font-bold">AdBase</h1>
        </div>
    </header>

    <!-- MAIN -->
    <main class="max-w-7xl mx-auto px-6 py-10 grid grid-cols-1 lg:grid-cols-3 gap-10">

        <!-- LEFT: AD SETUP -->
        <section class="lg:col-span-2 space-y-8">

            <!-- UPLOAD + PROMPT (Simplified: no product selection) -->
            <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                <h2 class="text-lg font-semibold mb-4">Product Image</h2>

                <!-- product image upload -->
                <div class="mb-3 bg-slate-950 border border-slate-800 rounded-xl p-3">
                    <label class="text-sm text-slate-300 font-medium">Upload product image</label>
                    <div class="flex items-center gap-3 mt-2">
                        <input id="imageInput" type="file" accept="image/*" class="text-sm text-slate-200" />
                        <button id="removeImageBtn"
                            class="hidden text-sm px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700">Remove</button>
                    </div>
                    <img id="imagePreview" class="mt-3 w-48 h-48 object-cover rounded-lg border border-slate-700 hidden"
                        src="" alt="Preview" />
                    <div id="uploadStatus" class="text-sm text-slate-400 mt-2"></div>
                </div>

                <h2 class="text-lg font-semibold mb-3">Actor</h2>
                <!-- actor selection -->
                <div class="mb-3 bg-slate-950 border border-slate-800 rounded-xl p-3">
                    <div class="relative">
                        <button id="actorDropdownButton" type="button"
                            class="w-full text-left bg-slate-900 border border-slate-700 rounded-2xl px-4 py-3 flex items-center justify-between gap-3 text-sm hover:border-primary transition">
                            <span id="actorDropdownLabel">Select an actor</span>
                            <span class="text-slate-400">▾</span>
                        </button>
                        <div id="actorDropdownMenu"
                            class="hidden absolute left-0 right-0 mt-2 max-h-72 overflow-y-auto rounded-2xl border border-slate-700 bg-slate-950 shadow-xl">
                            <div id="actorDropdownItems" class="divide-y divide-slate-800"></div>
                        </div>
                    </div>
                    <div id="actorPreview"
                        class="mt-3 hidden items-center gap-3 rounded-2xl border border-slate-700 bg-slate-900 p-3">
                        <img id="actorSelectedAvatar" class="w-16 h-16 rounded-xl object-cover" src=""
                            alt="Selected actor" />
                    </div>
                </div>

                <h2 class="text-lg font-semibold mb-4">Prompt</h2>
                <textarea id="autoBrief" rows="6"
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary">Warm lighting, slight camera push-in, clean product focus, UGC-style authentic ad</textarea>

                <!-- voice selection -->
                <div class="mt-4">
                    <label for="voiceSelect" class="block text-lg font-semibold mb-3">Voice</label>
                    <select id="voiceSelect"
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                    </select>
                </div>

                <button id="mainActionBtn" onclick="startGeneration()" disabled
                    class="mt-4 w-full py-4 rounded-2xl bg-primary/90 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-indigo-500 transition font-semibold text-lg">
                    Start Ad Generation
                </button>
            </section>

        </section>

        <!-- RIGHT: PROGRESS TIMELINE -->
        <aside class="bg-slate-900 border border-slate-800 rounded-2xl p-6">

            <h2 class="text-lg font-semibold mb-6">Generation Progress</h2>

            <ol id="timeline" class="relative border-l border-slate-700 space-y-6">

                <!-- <li class="ml-6 text-slate-500" data-step>
                    <span class="absolute -left-3 w-6 h-6 rounded-full bg-slate-700"></span>
                    <h3 class="font-semibold">Fetching Product Data</h3>
                </li>

                <li class="ml-6 text-slate-500" data-step>
                    <span class="absolute -left-3 w-6 h-6 rounded-full bg-slate-700"></span>
                    <h3 class="font-semibold">Generating Ad Script</h3>
                </li> -->

                <li class="ml-6 text-slate-500" data-step>
                    <span class="absolute -left-3 w-6 h-6 rounded-full bg-slate-700"></span>
                    <h3 class="font-semibold">Upload Product Image</h3>
                </li>

                <li class="ml-6 text-slate-500" data-step>
                    <span class="absolute -left-3 w-6 h-6 rounded-full bg-slate-700"></span>
                    <h3 class="font-semibold">Video Generation</h3>
                </li>

            </ol>

        </aside>

    </main>

    <!-- SCRIPT -->

                }

        }

        // populate voice select and load actor list on page load
        document.addEventListener('DOMContentLoaded', async () => {
            const select = document.getElementById('voiceSelect');
            if (select) {
                voiceData.voices.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.voice_id;
                    opt.textContent = v.name;
                    select.appendChild(opt);
                });
                selectedVoice = voiceData.default_voice.voice_id;
                select.value = selectedVoice;
                select.addEventListener('change', () => {
                    selectedVoice = select.value;
                });
            }
            await loadActors();
            updateMainButtonState();
        });

        async function loadActors() {
            availableActors = await fetchActors() || [];
            const items = document.getElementById('actorDropdownItems');
            const dropdownLabel = document.getElementById('actorDropdownLabel');
            if (!items || !dropdownLabel) return;

            if (!availableActors.length) {
                items.innerHTML = '<div class="p-4 text-sm text-slate-400">No actors available</div>';
                return;
            }

            items.innerHTML = availableActors.map(actor => `
                <button type="button" data-actor-id="${actor.id}" class="w-full text-left px-4 py-3 hover:bg-slate-900 transition flex items-center gap-3">
                    <img src="${actor.image_url}" alt="${actor.name}" class="w-12 h-12 rounded-xl object-cover border border-slate-700" />
                    <div>
                        <p class="font-semibold text-slate-100">${actor.name}</p>
                    </div>
                </button>
            `).join('');

            items.querySelectorAll('button[data-actor-id]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const actorId = btn.getAttribute('data-actor-id');
                    const actor = availableActors.find(a => a.id === actorId);
                    if (!actor) return;
                    selectedActorId = actor.id;
                    selectedActorName = actor.name;
                    selectedActorImage = actor.image_url;
                    dropdownLabel.textContent = actor.name;
                    selectActorPreview(actor);
                    document.getElementById('actorDropdownMenu').classList.add('hidden');
                    updateMainButtonState();
                });
            });
        }

        function selectActorPreview(actor) {
            const actorPreview = document.getElementById('actorPreview');
            const actorSelectedAvatar = document.getElementById('actorSelectedAvatar');
            if (!actorPreview || !actorSelectedAvatar) return;
            actorSelectedAvatar.src = actor.image_url;
            actorPreview.classList.remove('hidden');
        }

        const actorDropdownButton = document.getElementById('actorDropdownButton');
        const actorDropdownMenu = document.getElementById('actorDropdownMenu');
        actorDropdownButton?.addEventListener('click', () => {
            actorDropdownMenu?.classList.toggle('hidden');
        });
        document.addEventListener('click', (event) => {
            if (!actorDropdownButton?.contains(event.target) && !actorDropdownMenu?.contains(event.target)) {
                actorDropdownMenu?.classList.add('hidden');
            }
        });

        const steps = document.querySelectorAll("[data-step]");

        function setStepState(i, state, msg) {
            const step = steps[i];
            if (!step) return;
            step.classList.remove('text-slate-500', 'text-primary', 'text-success', 'text-red-500');
            const dot = step.querySelector('span');
            dot.classList.remove('bg-slate-700', 'bg-primary', 'bg-success', 'bg-red-600');

            if (state === 'in-progress') {
                step.classList.add('text-primary');
                dot.classList.add('bg-primary');
            } else if (state === 'success') {
                step.classList.add('text-success');
                dot.classList.add('bg-success');
            } else if (state === 'error') {
                step.classList.add('text-red-500');
                dot.classList.add('bg-red-600');
            } else {
                step.classList.add('text-slate-500');
                dot.classList.add('bg-slate-700');
            }

            const title = step.querySelector('h3');
            const existing = title.querySelector('.step-status');
            if (existing) existing.remove();
            if (msg) {
                const span = document.createElement('span');
                span.className = 'step-status text-sm text-slate-400 block mt-1';
                span.textContent = msg;
                title.appendChild(span);
            }
        }

        async function startGeneration() {

            try {
                // setStepState(0, 'in-progress', 'Starting');
                // await new Promise(r => setTimeout(r, 700));
                // setStepState(0, 'success', 'Ready');

                // setStepState(1, 'in-progress', 'Generating script');
                // await new Promise(r => setTimeout(r, 900));
                // setStepState(1, 'success', 'Script ready');

                // Step 2 -> upload
                setStepState(0, 'in-progress', 'Preparing assets');

                // Always upload images when starting generation; button is only enabled when both images are present
                let uploadResult = null;
                let jobId = currentJobId || null;
                setStepState(0, 'in-progress', 'Uploading assets...');
                uploadResult = await uploadImage();
                if (uploadResult && uploadResult.status) {
                    setStepState(0, 'success', `Uploaded All Details`);
                    jobId = uploadResult.job_id || currentJobId;
                } else {
                    setStepState(0, 'error', 'Upload failed');
                    return;
                }

                if (jobId && jobId.length > 1) {
                    setStepState(1, 'in-progress', 'Generating video');
                    await startJob(jobId);
                    setTimeout(() => {
                        window.alert('Ad generation started! Please check back in 2 to 3 mins.');
                        window.location.href = `library.html`;
                    }, 1000);
                    // let intervalId;
                    // intervalId = setInterval(async () => {
                    //     const statusData = await checkJobStatus(jobId);
                    //     if (statusData && statusData.status) {
                    //         if (statusData.status === 'succeeded') {
                    //             setStepState(1, 'success', 'Video generated successfully');
                    //             clearInterval(intervalId);
                    //             window.location.href = `library.html`;
                    //         } else if (statusData.status === 'processing' || statusData.status === 'pending') {
                    //             setStepState(1, 'in-progress', `Status: ${statusData.status}`);
                    //         } else {
                    //             setStepState(1, 'error', 'Video generation failed');
                    //             clearInterval(intervalId);
                    //         }
                    //     }
                    // }, 5000);
                } else {
                    setStepState(1, 'error', 'Error generating video');
                }
            } catch (err) {
                console.error(err);
            }
        }

        const imageInput = document.getElementById("imageInput");
        const imagePreview = document.getElementById("imagePreview");
        const uploadStatus = document.getElementById("uploadStatus");
        const removeImageBtn = document.getElementById("removeImageBtn");

        imageInput.addEventListener('change', handleImageSelect);
        removeImageBtn.addEventListener('click', removeSelectedImage);

        function updateMainButtonState() {
            const mainBtn = document.getElementById('mainActionBtn');
            if (!mainBtn) return;
            if (selectedImageFile && selectedActorId) {
                mainBtn.disabled = false;
                mainBtn.textContent = 'Upload details';
            } else {
                mainBtn.disabled = true;
                mainBtn.textContent = 'Upload details';
            }
        }

        function handleImageSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            selectedImageFile = file;
            imagePreview.src = URL.createObjectURL(file);
            imagePreview.classList.remove('hidden');
            removeImageBtn.classList.remove('hidden');
            uploadStatus.textContent = 'Ready to upload...';
            updateMainButtonState();
        }

        function removeSelectedImage() {
            selectedImageFile = null;
            selectedImageUrl = null;
            imageInput.value = '';
            imagePreview.src = '';
            imagePreview.classList.add('hidden');
            removeImageBtn.classList.add('hidden');
            uploadStatus.textContent = '';
            updateMainButtonState();
        }

        async function uploadImage() {
            if (!selectedImageFile || !selectedActorId) return;
            const prompt = document.getElementById('autoBrief')?.value || '';
            const fd = new FormData();
            fd.append('product_images', selectedImageFile, selectedImageFile.name);
            fd.append('actor_variant_id', selectedActorId);
            fd.append('prompt', prompt);
            if (selectedVoice) {
                fd.append('voice', selectedVoice);
            }

            uploadStatus.textContent = 'Uploading image...';
            imageInput.disabled = true;

            const token = localStorage.getItem('adbase_token');
            try {
                const res = await fetch('https://backend.tryadbase.com/api/jobs/upload-full', {
                    method: 'POST',
                    body: fd,
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                });

                if (!res.ok) {
                    const text = await res.text();
                    uploadStatus.textContent = `Upload failed: ${res.status} ${res.statusText}`;
                    console.error('Upload error:', text);
                    imageInput.disabled = false;
                    return null;
                }

                const data = await res.json();
                // API returns image_url, job_id, prompt, status

                // Save returned job id and enable main action button
                if (data.job_id) {
                    currentJobId = data.job_id;
                }

                return data;
            } catch (err) {
                console.error(err);
                uploadStatus.textContent = 'Upload failed (network error)';
                return null;
            } finally {
                imageInput.disabled = false;
            }
        }

        async function startJob(jobId) {
            const token = localStorage.getItem('adbase_token');

            try {
                const res = fetch(`https://backend.tryadbase.com/api/jobs/${jobId}/start-full`, {
                    method: 'POST',
                    body: JSON.stringify({ use_agents: true, tone: "friendly", duration_target_sec: 12 }),
                    headers: {
                        Authorization: `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                return true;
            } catch (err) {
                console.error(err);
                setStepState(1, 'error', 'Failed to start job');
                return false;
            }
        }

        //     try {
        //         const res = await fetch(`https://backend.tryadbase.com/api/jobs/${jobId}`, {
        //             headers: {

        //             }
        //         });

        //         if (!res.ok) {
        //             const text = await res.json();
        //             console.error('Check job status error:', text);
        //             return null;
        //         }

        //         const data = await res.json();
        //         return data;
        //     } catch (err) {

        //         return null;
        //     }
        // }
        async function fetchActors() {
            try {
                const token = localStorage.getItem('adbase_token');
                const response = await fetch("https://backend.tryadbase.com/api/actors", {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                    }
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const data = await response.json();
                let actors = data.actors || [];
                actors = actors.filter(actor => actor.primary_variant && actor.primary_variant.image_url);
                return actors.map(actor => ({
                    id: actor.primary_variant.id,
                    name: actor.name,
                    image_url: actor.primary_variant.image_url
                }));
            } catch (error) {
                console.error("Error fetching actors:", error);
            }
        }
    </script>
