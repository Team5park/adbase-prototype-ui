<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Continue with Google — AdBase</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#4f46e5",
            accent: "#22c55e"
          }
        }
      }
    }
  </script>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center">

  <!-- Background Glow -->
  <div class="absolute inset-0 overflow-hidden">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-primary/30 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 -left-40 w-96 h-96 bg-accent/20 rounded-full blur-3xl"></div>
  </div>

  <!-- Auth Card -->
  <div class="relative z-10 w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-8 text-center">

    <!-- Brand -->
    <h1 class="text-2xl font-bold mb-2">AdBase</h1>
    <p class="text-slate-400 mb-8">
      Create high-converting ads in minutes
    </p>

    <!-- Google Button -->
    <button
      onclick="handleGoogleAuth()"
      class="w-full flex items-center justify-center gap-3 px-4 py-3 rounded-xl bg-white text-slate-900 font-semibold hover:bg-slate-100 transition"
    >
      <!-- Google Icon -->
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.16 2.84l6.1-6.1C34.51 2.58 29.6 0 24 0 14.64 0 6.51 5.36 2.56 13.16l7.38 5.73C12.02 13.01 17.53 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.64-.14-3.21-.4-4.74H24v9.02h12.7c-.55 2.95-2.19 5.45-4.66 7.13l7.3 5.66C43.91 37.57 46.5 31.61 46.5 24.5z"/>
        <path fill="#FBBC05" d="M9.94 28.89c-.49-1.45-.77-2.99-.77-4.57s.28-3.12.77-4.57l-7.38-5.73C.9 17.2 0 20.52 0 24.32s.9 7.12 2.56 10.3l7.38-5.73z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.92-2.14 15.9-5.82l-7.3-5.66c-2.03 1.37-4.62 2.17-8.6 2.17-6.47 0-11.98-3.51-14.06-9.39l-7.38 5.73C6.51 42.64 14.64 48 24 48z"/>
      </svg>
      Continue with Google
    </button>

    <!-- Disclaimer -->
    <p class="text-xs text-slate-500 mt-6">
      By continuing, you agree to AdBase’s Terms of Service and Privacy Policy.
    </p>

  </div>

  <!-- Mock Google Auth -->
  <script>
    function handleGoogleAuth() {
      // Mock success
      setTimeout(() => {
        window.location.href = "onboarding.html";
      }, 600);
    }
  </script>

</body>
</html>
