<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — AdBase</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#4f46e5",
            accent: "#22c55e"
          }
        }
      }
    }
  </script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- HEADER -->
  <header class="border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <h1 class="text-xl font-bold">AdBase</h1>

      <div class="flex items-center gap-4">
        <span class="text-sm text-slate-400">Hi, Brand</span>
        <img
          src="https://ui-avatars.com/api/?name=Brand"
          alt="Avatar"
          class="w-8 h-8 rounded-full border border-slate-700"
        />
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-7xl mx-auto px-6 py-12">

    <!-- HERO CTA -->
    <section class="bg-gradient-to-br from-primary/20 to-accent/10 border border-slate-800 rounded-3xl p-10 mb-12">
      <h2 class="text-3xl font-extrabold mb-4">
        Ready to create your next ad?
      </h2>
      <p class="text-slate-300 mb-6 max-w-2xl">
        Turn your Shopify products into high-performing short-form ads with AI.
      </p>
      <a
        href="ad-generation.html"
        class="inline-block px-6 py-3 rounded-xl bg-primary hover:bg-indigo-500 transition font-semibold"
      >
        Create New Ad
      </a>
    </section>

    <!-- RECENT ADS -->
    <section>
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-xl font-semibold">Recent Ads</h3>
        <a href="library.html" class="text-sm text-primary hover:underline">
          View all
        </a>
      </div>

      <!-- Empty State -->
      <div
        id="emptyState"
        class="border border-dashed border-slate-700 rounded-2xl p-12 text-center text-slate-400"
      >
        <p class="mb-4">You haven’t created any ads yet.</p>
        <a
          href="ad-generation.html"
          class="inline-block px-5 py-2.5 rounded-xl bg-primary hover:bg-indigo-500 transition font-medium"
        >
          Create Your First Ad
        </a>
      </div>

      <!-- Ads Grid -->
      <div
        id="adsGrid"
        class="hidden grid grid-cols-1 md:grid-cols-3 gap-6"
      >
        <!-- Ad Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
          <div class="h-40 bg-slate-800 flex items-center justify-center text-slate-500">
            Ad Preview
          </div>
          <div class="p-4">
            <h4 class="font-semibold">Product Name</h4>
            <p class="text-sm text-slate-400">Generated 2 hours ago</p>
          </div>
        </div>
      </div>

    </section>

  </main>

  <!-- MOCK DATA SCRIPT -->
  <script>
    // Mock ads data
    const ads = [];

    const emptyState = document.getElementById("emptyState");
    const adsGrid = document.getElementById("adsGrid");

    if (ads.length > 0) {
      emptyState.classList.add("hidden");
      adsGrid.classList.remove("hidden");
    }
  </script>

</body>
</html>
