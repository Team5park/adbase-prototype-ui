<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Brand Setup — AdBase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#4f46e5",
            success: "#22c55e"
          }
        }
      }
    }
  </script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- HEADER -->
  <header class="border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-6 py-4">
      <h1 class="text-xl font-bold">AdBase</h1>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-4xl mx-auto px-6 py-12">

    <!-- TITLE -->
    <section class="mb-10">
      <h2 class="text-3xl font-extrabold mb-2">Set up your brand</h2>
      <p class="text-slate-400">
        You can fill details manually or let AdBase pull them automatically.
      </p>
    </section>

    <!-- SOURCE SELECTION -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">

      <!-- Instagram -->
      <button
        onclick="autoFill('instagram')"
        class="bg-slate-900 border border-slate-800 hover:border-primary transition rounded-2xl p-6 text-left"
      >
        <h3 class="font-semibold text-lg">Instagram</h3>
        <p class="text-sm text-slate-400 mt-1">
          Pull brand voice, bio, links, and visuals
        </p>
      </button>

      <!-- Website -->
      <button
        onclick="autoFill('website')"
        class="bg-slate-900 border border-slate-800 hover:border-primary transition rounded-2xl p-6 text-left"
      >
        <h3 class="font-semibold text-lg">Website</h3>
        <p class="text-sm text-slate-400 mt-1">
          Analyze homepage & content
        </p>
      </button>

      <!-- Shopify -->
      <button
        onclick="autoFill('shopify')"
        class="bg-slate-900 border border-slate-800 hover:border-primary transition rounded-2xl p-6 text-left"
      >
        <h3 class="font-semibold text-lg">Shopify</h3>
        <p class="text-sm text-slate-400 mt-1">
          Products, branding & tone
        </p>
      </button>

    </section>

    <!-- BRAND FORM -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-8 space-y-6">

      <h3 class="text-xl font-semibold">Brand Information</h3>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <div>
          <label class="text-sm text-slate-400">Brand Name</label>
          <input
            id="brandName"
            type="text"
            class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none"
          />
        </div>

        <div>
          <label class="text-sm text-slate-400">Industry</label>
          <input
            id="industry"
            type="text"
            class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none"
          />
        </div>

        <div>
          <label class="text-sm text-slate-400">Brand Tone</label>
          <select
            id="tone"
            class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3"
          >
            <option>Friendly</option>
            <option>Premium</option>
            <option>Bold</option>
            <option>Playful</option>
            <option>Minimal</option>
          </select>
        </div>

        <div>
          <label class="text-sm text-slate-400">Primary Color</label>
          <input
            id="color"
            type="color"
            class="w-full mt-1 h-12 bg-slate-950 border border-slate-700 rounded-xl"
          />
        </div>

      </div>

      <div>
        <label class="text-sm text-slate-400">Brand Description</label>
        <textarea
          id="description"
          rows="4"
          class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3"
        ></textarea>
      </div>

      <button
        class="w-full mt-6 py-4 rounded-2xl bg-primary hover:bg-indigo-500 transition font-semibold text-lg"
      >
        Save & Continue
      </button>

    </section>

  </main>

  <!-- MOCK AUTO-FILL -->
  <script>
    function autoFill(source) {
      if (source === "instagram") {
        document.getElementById("brandName").value = "GlowSkin";
        document.getElementById("industry").value = "Skincare";
        document.getElementById("tone").value = "Friendly";
        document.getElementById("description").value =
          "GlowSkin creates clean, everyday skincare designed for glowing, healthy skin.";
      }

      if (source === "website") {
        document.getElementById("brandName").value = "UrbanFit";
        document.getElementById("industry").value = "Fitness Apparel";
        document.getElementById("tone").value = "Bold";
        document.getElementById("description").value =
          "UrbanFit makes performance-driven apparel for modern athletes.";
      }

      if (source === "shopify") {
        document.getElementById("brandName").value = "EcoHome";
        document.getElementById("industry").value = "Home & Living";
        document.getElementById("tone").value = "Minimal";
        document.getElementById("description").value =
          "EcoHome delivers sustainable products for a cleaner lifestyle.";
      }
    }
  </script>

</body>
</html>
