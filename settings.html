<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Settings — AdBase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#4f46e5",
            danger: "#ef4444",
            success: "#22c55e"
          }
        }
      }
    }
  </script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- HEADER -->
  <header class="border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold">AdBase</h1>
      <a
        href="dashboard.html"
        class="text-sm text-slate-400 hover:text-white"
      >
        ← Back to Dashboard
      </a>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-5xl mx-auto px-6 py-10 space-y-12">

    <!-- BRAND SETTINGS -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-8">
      <h2 class="text-xl font-semibold mb-6">Brand Settings</h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="text-sm text-slate-400">Brand Name</label>
          <input
            type="text"
            value="AdBase"
            class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3"
          />
        </div>

        <div>
          <label class="text-sm text-slate-400">Industry</label>
          <input
            type="text"
            value="Marketing & Ads"
            class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3"
          />
        </div>

        <div>
          <label class="text-sm text-slate-400">Brand Tone</label>
          <select
            class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3"
          >
            <option>Friendly</option>
            <option selected>Bold</option>
            <option>Premium</option>
            <option>Minimal</option>
          </select>
        </div>

        <div>
          <label class="text-sm text-slate-400">Primary Color</label>
          <input
            type="color"
            value="#4f46e5"
            class="w-full mt-1 h-12 bg-slate-950 border border-slate-700 rounded-xl"
          />
        </div>
      </div>

      <button
        class="mt-6 px-6 py-3 rounded-xl bg-primary hover:bg-indigo-500 transition font-semibold"
      >
        Save Changes
      </button>
    </section>

    <!-- INTEGRATIONS -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-8">
      <h2 class="text-xl font-semibold mb-6">Integrations</h2>

      <div class="space-y-4">

        <!-- Shopify -->
        <div class="flex justify-between items-center border border-slate-800 rounded-xl p-4">
          <div>
            <h3 class="font-semibold">Shopify</h3>
            <p class="text-sm text-slate-400">Import products automatically</p>
          </div>
          <button class="px-4 py-2 rounded-xl bg-success text-black font-medium">
            Connected
          </button>
        </div>

        <!-- Instagram -->
        <div class="flex justify-between items-center border border-slate-800 rounded-xl p-4">
          <div>
            <h3 class="font-semibold">Instagram</h3>
            <p class="text-sm text-slate-400">Pull brand voice & creatives</p>
          </div>
          <button class="px-4 py-2 rounded-xl border border-slate-600 hover:border-primary">
            Connect
          </button>
        </div>

        <!-- Google -->
        <div class="flex justify-between items-center border border-slate-800 rounded-xl p-4">
          <div>
            <h3 class="font-semibold">Google</h3>
            <p class="text-sm text-slate-400">Sign-in & analytics</p>
          </div>
          <button class="px-4 py-2 rounded-xl bg-success text-black font-medium">
            Connected
          </button>
        </div>

      </div>
    </section>

    <!-- ACCOUNT -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-8">
      <h2 class="text-xl font-semibold mb-6">Account</h2>

      <div class="space-y-4">
        <button class="w-full text-left px-4 py-3 rounded-xl border border-slate-700 hover:border-primary">
          Log out
        </button>

        <button class="w-full text-left px-4 py-3 rounded-xl border border-danger text-danger hover:bg-danger/10">
          Delete Account
        </button>
      </div>
    </section>

  </main>

</body>
</html>
